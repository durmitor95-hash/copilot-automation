# NexusConfig - Configuration Format
# Kombinacija JSON i YAML fleksibilnosti

app {
    name: "MyApplication"
    version: "1.0.0"
    debug: true
}

database {
    host: "localhost"
    port: 5432
    credentials: {
        user: "admin"
        password: "secret123"
    }
}

servers: [
    {
        name: "web-server"
        port: 8080
        ssl: true
    }
    {
        name: "api-server"
        port: 3000
        ssl: false
    }
]

features {
    authentication: enabled
    caching: {
        enabled: true
        ttl: 3600
    }
    logging: {
        level: "INFO"
        output: "file"
        path: "/var/log/app.log"
    }
}
